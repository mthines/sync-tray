# .agent/claude-cache-directory-migration-rsbsmr/checks.yaml — executable acceptance criteria.
# Derived from plan.md Acceptance Criteria by aw-create-plan. Re-derived
# (statuses reset to pending) on every plan iteration.
#
# EXECUTOR CONTRACT: only `status:` may be flipped freely. `run:`/`setup:`
# may be amended ONLY with a check-run-amended Progress Log entry.
# `id:`, `requirement:`, `ears:`, `expect:` are IMMUTABLE to the executor.
#
# HOST CONSTRAINTS baked into every `run:` below:
#   * There is NO Swift toolchain on this host. No check invokes a compiler.
#     The compile gate is AC-22, resolved by polling the CI `test` job with
#     the mcp__github__* tools.
#   * The `xcodeproj` Ruby gem needs a UTF-8 locale — every ruby invocation
#     is prefixed LANG=C.UTF-8 LC_ALL=C.UTF-8.
#   * All checks run with cwd = /home/user/sync-tray.
#
# BASELINE (measured 2026-09-08, zero implementation present): AC-11, AC-22
# and AC-23 already print OK because they lock behaviour/constraints that
# hold today; every other check prints nothing. That baseline IS the
# negative demonstration — a check that printed OK before any code existed
# would be fail-open and must be rewritten, not trusted.

- id: AC-1
  requirement: R13
  ears: "Where the cache tree kinds are enumerated, CacheTreeKind shall declare exactly content = \"vfs\" and meta = \"vfsMeta\", and the planner shall emit one CacheSubtree per kind by iterating CacheTreeKind.allCases"
  kind: grep
  setup: none
  run: "F=SyncTray/Services/CacheMigrationPlanner.swift; test -s \"$F\" && grep -q 'case content = \"vfs\"' \"$F\" && grep -q 'case meta = \"vfsMeta\"' \"$F\" && grep -q 'CacheTreeKind.allCases' \"$F\" && echo OK"
  expect: "OK"
  status: pending

- id: AC-2
  requirement: R26
  ears: "When the cache subtree key is needed, both VFSCacheService.cacheDirectory(for:) and CacheMigrationPlanner shall obtain it from the single VFSCacheService.cacheRelativePath(for:), and normalizeRoot shall apply expandingTildeInPath"
  kind: grep
  setup: none
  run: "V=SyncTray/Services/VFSCacheService.swift; P=SyncTray/Services/CacheMigrationPlanner.swift; test -s \"$V\" && test -s \"$P\" && test \"$(grep -c 'static func cacheRelativePath' \"$V\")\" = 1 && grep -q 'metaCacheDirectory' \"$V\" && awk '/func cacheDirectory\\(for/,/^    \\}$/' \"$V\" | grep -q 'cacheRelativePath' && grep -q 'cacheRelativePath' \"$P\" && awk '/func normalizeRoot/,/^    \\}$/' \"$P\" | grep -q 'expandingTildeInPath' && echo OK"
  expect: "OK"
  status: pending

- id: AC-3
  requirement: R15
  ears: "When another profile's cache key overlaps the moving profile's at the same root and is not in coMigrate, the planner shall reject with unresolvedOverlap naming it; when it is in coMigrate its subtrees and id shall be included; a non-overlapping same-root profile shall appear only in sameRootProfiles"
  kind: grep
  setup: none
  run: "P=SyncTray/Services/CacheMigrationPlanner.swift; T=SyncTray/Services/ConfigSelfTest.swift; test -s \"$P\" && grep -q 'case unresolvedOverlap' \"$P\" && grep -q 'excludedRelativePaths' \"$P\" && grep -q 'sameRootProfiles' \"$P\" && grep -q 'profileIdsToRewrite' \"$P\" && grep -q 'AC-CM3' \"$T\" && echo OK"
  expect: "OK"
  status: pending

- id: AC-4
  requirement: R1
  ears: "When source and destination share a volume identifier and there are no excluded descendants, the engine shall relocate whole subtrees with moveItem; otherwise it shall relocate file-by-file and shall never call moveItem on a subtree root"
  kind: grep
  setup: none
  run: "E=SyncTray/Services/CacheMigrationService.swift; test -s \"$E\" && grep -q 'volumeIdentifier' \"$E\" && grep -q 'sameVolume' \"$E\" && grep -q 'func fastPathMove' \"$E\" && grep -q 'func moveFile' \"$E\" && grep -q 'func copyFileDataOnly\\|copyFileDataOnly' \"$E\" && R=$(awk '/func fastPathMove/,/^    \\}$/' \"$E\"); test -n \"$R\" && printf '%s' \"$R\" | grep -q 'excludedRelativePaths\\|sameVolume' && grep -q 'AC-CM4' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-5
  requirement: R2
  ears: "When the destination volume's available capacity is below bytesToCopy plus freeSpaceHeadroomBytes, preflight shall return insufficientSpace(requiredBytes:availableBytes:) and run shall not be reached, so no destination file is created"
  kind: grep
  setup: none
  run: "E=SyncTray/Services/CacheMigrationService.swift; test -s \"$E\" && grep -q 'freeSpaceHeadroomBytes' \"$E\" && grep -q 'case insufficientSpace(requiredBytes: Int64, availableBytes: Int64)' \"$E\" && grep -q 'availableCapacity' \"$E\" && R=$(awk '/func preflight/,/^    \\}$/' \"$E\"); test -n \"$R\" && printf '%s' \"$R\" | grep -q 'freeSpaceHeadroomBytes' && grep -q 'AC-CM5' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-6
  requirement: R19
  ears: "For each file the engine shall copy, then compare the destination byte size to the source size, and only then delete the source; on a size difference it shall remove the destination partial and return failed(.verifyMismatch) with every source file present; and after the loop it shall reconcile filesMoved and bytesMoved against the preflight totals, returning failed(.countMismatch) on a mismatch"
  kind: grep
  setup: none
  run: "E=SyncTray/Services/CacheMigrationService.swift; test -s \"$E\" && grep -q 'case verifyMismatch' \"$E\" && grep -q 'case countMismatch' \"$E\" && grep -q 'func reconcile' \"$E\" && R=$(awk '/func moveFile/,/^    \\}$/' \"$E\"); test -n \"$R\" && C=$(printf '%s' \"$R\" | grep -n 'fileSize' | head -1 | cut -d: -f1) && D=$(printf '%s' \"$R\" | grep -n 'removeItem' | tail -1 | cut -d: -f1) && test -n \"$C\" && test -n \"$D\" && test \"$C\" -lt \"$D\" && grep -q 'AC-CM6' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-7
  requirement: R20
  ears: "When a migration outcome is anything other than completed, the orchestration shall not write vfsCachePath, so the persisted profile file still names the source root"
  kind: grep
  setup: none
  run: "M=SyncTray/Services/SyncManager.swift; test -s \"$M\" && R=$(awk '/func migrateCacheDirectory/,/^    \\}$/' \"$M\"); test -n \"$R\" && printf '%s' \"$R\" | grep -q 'vfsCachePath' && printf '%s' \"$R\" | grep -q 'case .completed' && test \"$(printf '%s' \"$R\" | awk '/case .completed/{f=1} f && /vfsCachePath =/{n++} END{print n+0}')\" -ge 1 && grep -q 'AC-CM7' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-8
  requirement: R3
  ears: "While a migration runs, SyncManager.cacheMigrationProgress shall publish files done/total and bytes done/total; when isCancelled returns true the engine shall stop at a file boundary, remove any in-flight destination partial, and return cancelled; and on re-run a destination file whose size already matches shall be skipped rather than re-copied"
  kind: grep
  setup: none
  run: "P=SyncTray/Models/CacheMigrationProgress.swift; E=SyncTray/Services/CacheMigrationService.swift; M=SyncTray/Services/SyncManager.swift; test -s \"$P\" && test -s \"$E\" && grep -q 'filesTotal' \"$P\" && grep -q 'bytesTotal' \"$P\" && grep -q 'filesDone' \"$P\" && grep -q 'bytesDone' \"$P\" && grep -q '@Published private(set) var cacheMigrationProgress' \"$M\" && grep -q 'isCancelled' \"$E\" && grep -q 'case cancelled' \"$E\" && grep -q 'AC-CM8' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-9
  requirement: R4
  ears: "When a migration starts, the orchestration shall call SyncSetupService.uninstall for each affected installed profile before the move, and shall call SyncSetupService.install on every exit path including failure, cancellation and a thrown error"
  kind: grep
  setup: none
  run: "M=SyncTray/Services/SyncManager.swift; test -s \"$M\" && R=$(awk '/func migrateCacheDirectory/,/^    \\}$/' \"$M\"); test -n \"$R\" && U=$(printf '%s' \"$R\" | grep -n 'setupService.uninstall' | head -1 | cut -d: -f1) && I=$(printf '%s' \"$R\" | grep -n 'setupService.install' | head -1 | cut -d: -f1) && test -n \"$U\" && test -n \"$I\" && test \"$U\" -lt \"$I\" && printf '%s' \"$R\" | grep -q 'defer' && grep -q 'AC-CM9' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-10
  requirement: R5
  ears: "When a migration starts, SyncManager.cancelWarm shall be called for every affected profile before any file is touched"
  kind: grep
  setup: none
  run: "M=SyncTray/Services/SyncManager.swift; test -s \"$M\" && R=$(awk '/func migrateCacheDirectory/,/^    \\}$/' \"$M\"); test -n \"$R\" && W=$(printf '%s' \"$R\" | grep -n 'cancelWarm' | head -1 | cut -d: -f1) && U=$(printf '%s' \"$R\" | grep -n 'setupService.uninstall' | head -1 | cut -d: -f1) && test -n \"$W\" && test -n \"$U\" && test \"$W\" -lt \"$U\" && grep -q 'AC-CM10' SyncTray/Services/ConfigSelfTest.swift && echo OK"
  expect: "OK"
  status: pending

- id: AC-11
  requirement: R6
  ears: "SyncSetupService.generateProfileConfig shall continue to emit the vfsCachePath key, the generated script shall continue to read it with the same default, and install shall continue to pre-create the expanded cache directory, so all three consumers agree"
  kind: grep
  setup: none
  run: "S=SyncTray/Services/SyncSetupService.swift; test -s \"$S\" && awk '/func generateProfileConfig/,/^    \\}$/' \"$S\" | grep -q '\"vfsCachePath\": profile.vfsCachePath' && grep -q 'VFS_CACHE_PATH=$(parse_json \"vfsCachePath\" \"$HOME/.cache/rclone\")' \"$S\" && grep -q 'profile.vfsCachePath as NSString).expandingTildeInPath' \"$S\" && bash scripts/check-schema-in-sync.sh >/dev/null && echo OK"
  expect: "OK"
  status: pending

- id: AC-12
  requirement: R7
  ears: "When a migration completes, SyncManager.updateAppGroupMountPaths shall be called so the FinderSync App Group profile data is re-pushed and the extension is re-woken through the existing pinRequest notification"
  kind: grep
  setup: none
  run: "M=SyncTray/Services/SyncManager.swift; test -s \"$M\" && R=$(awk '/func migrateCacheDirectory/,/^    \\}$/' \"$M\"); test -n \"$R\" && printf '%s' \"$R\" | grep -q 'updateAppGroupMountPaths()' && awk '/func updateAppGroupMountPaths/,/^    \\}$/' \"$M\" | grep -q 'notifyFinderSyncReload()' && echo OK"
  expect: "OK"
  status: pending

- id: AC-13
  requirement: R8
  ears: "When vfsCachePath changes via an external profile-file edit, reconcileAction shall still return reinstall and no migration entry point shall be invoked; and every profile rewrite the migration performs shall go through ProfileStore, which records the write in ConfigSelfWriteRegistry"
  kind: grep
  setup: none
  run: "C=SyncTray/Services/ConfigReconciler.swift; M=SyncTray/Services/SyncManager.swift; test -s \"$C\" && awk '/nonisolated static func reconcileAction/,/^    \\}$/' \"$C\" | grep -q 'current.vfsCachePath != updated.vfsCachePath' && R=$(awk '/func applyExternalProfileEdit/,/^    \\}$/' \"$M\"); test -n \"$R\" && test \"$(printf '%s' \"$R\" | grep -Ec 'startCacheMigration|migrateCacheDirectory')\" = 0 && O=$(awk '/func migrateCacheDirectory/,/^    \\}$/' \"$M\"); test -n \"$O\" && printf '%s' \"$O\" | grep -q 'profileStore.update' && grep -q 'noteSelfWrite' SyncTray/Services/ProfileStore.swift && grep -q 'external edit' CLAUDE.md && echo OK"
  expect: "OK"
  status: pending

- id: AC-14
  requirement: R9
  ears: "TelemetryService shall register the cache-migration counter, duration histogram, throughput histogram, files counter and bytes counter, expose beginCacheMigration and endCacheMigration, and no new telemetry call shall pass a cache path, remote name, or any path-valued expression as an attribute"
  kind: grep
  setup: none
  run: "T=SyncTray/Services/TelemetryService.swift; test -s \"$T\" && test \"$(grep -c 'synctray.cache.migration' \"$T\")\" -ge 5 && grep -q 'func beginCacheMigration' \"$T\" && grep -q 'func endCacheMigration' \"$T\" && grep -q 'synctray cache_migration' \"$T\" && R=$(awk '/func beginCacheMigration/,/^    \\}$/' \"$T\"; awk '/func endCacheMigration/,/^    \\}$/' \"$T\"); test -n \"$R\" && test \"$(printf '%s' \"$R\" | grep -Eic 'vfsCachePath|sourceRoot|destinationRoot|cachePath|rcloneRemote|remotePath|localSyncPath')\" = 0 && echo OK"
  expect: "OK"
  status: pending

- id: AC-15
