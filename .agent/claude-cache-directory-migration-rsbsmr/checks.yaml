- id: AC-18
  requirement: R18
  ears: "When invoked as cache move <target> --to <path>, the CLI shall parse cacheMove, route to CLIEnvironment.migrateCache, return non-zero on rejection or failure, refuse a non-mount profile and an unresolved target, fail with EX_USAGE when --to is absent, and map the invocation to the bounded telemetry verb cache-move"
  kind: grep
  setup: none
  run: "C=SyncTray/CLI/SyncTrayCLI.swift; T=SyncTray/Services/ConfigSelfTest.swift; test -s \"$C\" && grep -q 'case cacheMove(target: String, destination: String, includeOverlapping: Bool)' \"$C\" && grep -q 'var migrateCache' \"$C\" && grep -q 'func runCacheMove' \"$C\" && grep -q 'include-overlapping' \"$C\" && grep -q 'cache move' \"$C\" && awk '/static func telemetryVerb/,/^    \\}$/' \"$C\" | grep -q 'cache' && awk '/static func production/,/^    \\}$/' \"$C\" | grep -q 'migrateCache' && grep -q 'AC-CM-CLI' \"$T\" && echo OK"
  expect: "OK"
  status: pending

- id: AC-19
  requirement: R11
  ears: "CLAUDE.md shall document the cache-move behaviour in the mount/VFS section, list the new source files in its tables, name vfsMeta in the generated-files table, and .claude/rules/telemetry.md shall list the new metrics, span and log records"
  kind: grep
  setup: none
  run: "grep -q 'vfsMeta' CLAUDE.md && grep -q 'CacheMigrationPlanner.swift' CLAUDE.md && grep -q 'CacheMigrationService.swift' CLAUDE.md && grep -q 'CacheMigrationProgress.swift' CLAUDE.md && grep -q 'cache move' CLAUDE.md && test \"$(grep -c 'synctray.cache.migration' .claude/rules/telemetry.md)\" -ge 5 && grep -q 'synctray cache_migration' .claude/rules/telemetry.md && echo OK"
  expect: "OK"
  status: pending

- id: AC-20
  requirement: R12
  ears: "Every new AC-CM self-test function shall be registered in ConfigSelfTest.run()'s checks array, shall drive the planner, engine and CLI through fakes with no real filesystem, process or launchd access, and each shall have a pre-committed perturbation in the plan's Guard-Bites table demonstrated to flip it to FAIL"
  kind: command
  setup: none
  run: "T=SyncTray/Services/ConfigSelfTest.swift; D=$(grep -c 'private static func testCacheMigration' \"$T\"); R=$(awk '/let checks: \\[\\(\\) -> Bool\\] = \\[/,/^        \\]$/' \"$T\" | grep -c 'testCacheMigration'); G=$(grep -c '^| AC-CM' .agent/claude-cache-directory-migration-rsbsmr/plan.md); test \"$D\" -ge 8 && test \"$R\" = \"$D\" && test \"$G\" -ge 11 && grep -q 'fakeCacheMigrationFileSystem' \"$T\" && test \"$(git status --porcelain | wc -l)\" = 0 && echo OK"
  expect: "OK"
  status: pending

- id: AC-21
  requirement: R21
  ears: "Every new Swift file shall appear in project.pbxproj, the project shall re-open cleanly under xcodeproj with every source build-phase file reference resolving on disk, and the pbxproj diff shall add lines only"
  kind: command
  setup: none
  run: "P=SyncTray.xcodeproj/project.pbxproj; for f in CacheMigrationPlanner.swift CacheMigrationService.swift CacheMigrationProgress.swift CacheMoveSheet.swift; do grep -q \"$f\" \"$P\" || exit 1; done; LANG=C.UTF-8 LC_ALL=C.UTF-8 ruby -e 'require \"xcodeproj\"; p = Xcodeproj::Project.open(\"SyncTray.xcodeproj\"); t = p.targets.find { |x| x.name == \"SyncTray\" }; abort(\"unresolved refs\") unless t.source_build_phase.files.all? { |f| f.file_ref && File.exist?(f.file_ref.real_path) }' && DEL=$(git diff origin/main --numstat -- \"$P\" | awk '{print $2}') && test \"${DEL:-0}\" = 0 && echo OK"
  expect: "OK"
  status: pending

- id: AC-22
  requirement: R22
  ears: "No entry in checks.yaml shall invoke the Xcode command-line build tool, and the compile gate shall be represented by exactly one explicitly CI-delegated check whose verdict comes from the CI test job"
  kind: judge
  setup: "CI-DELEGATED. Resolve by reading the CI `test` job for the pushed head commit with mcp__github__actions_list / mcp__github__get_job_logs; its Build (Debug) step is the only compile signal available, because this host has no Swift toolchain. Record the run id and conclusion in the plan's Progress Log."
  run: "C=.agent/claude-cache-directory-migration-rsbsmr/checks.yaml; test -s \"$C\" && test \"$(grep -Ec 'xcodebuil[d]' \"$C\")\" = 0 && test \"$(grep -c '^  setup: \"CI-DELEGATED' \"$C\")\" = 1 && echo OK"
  expect: "OK plus a green CI test job for the pushed head commit"
  status: pending

- id: AC-23
  requirement: R23
  ears: "Work shall be committed on branch claude/cache-directory-migration-rsbsmr with exactly one worktree, and the plan artifacts shall live under .agent/claude-cache-directory-migration-rsbsmr/ with .agent gitignored"
  kind: command
  setup: none
  run: "test \"$(git branch --show-current)\" = 'claude/cache-directory-migration-rsbsmr' && test \"$(git worktree list | wc -l)\" = 1 && git check-ignore -q .agent && test -s .agent/claude-cache-directory-migration-rsbsmr/plan.md && test -s .agent/claude-cache-directory-migration-rsbsmr/checks.yaml && echo OK"
  expect: "OK"
  status: pending

- id: AC-24
  requirement: R24
  ears: "Every commit added on this branch shall end with the Claude-Session trailer, and no pull request shall reference this branch"
  kind: command
  setup: "The no-pull-request half is confirmed with mcp__github__pull_request_read (or an equivalent MCP query) and recorded in the plan's Progress Log; the shell half below covers the trailer."
  run: "N=$(git rev-list --count origin/main..HEAD); T=$(git log origin/main..HEAD --format=%B | grep -c '^Claude-Session: https://claude.ai/code/session_01FnCojx4XgeRpVPZayStGgZ$'); test \"$N\" -gt 0 && test \"$N\" = \"$T\" && echo OK"
  expect: "OK"
  status: pending

- id: AC-25
